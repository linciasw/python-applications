# Where to look for jobs.
#
# type:
#   workday         - *.myworkdayjobs.com sites (JSON API)
#   oracle_hcm      - Oracle Recruiting Cloud (fa-*.oraclecloud.com) sites (REST API)
#   successfactors  - SAP SuccessFactors "Career Site Builder" sites (careers.x.com/go/... or /search/)
#   icims           - *.icims.com sites
#   links           - any page where every job is a link matching `link_regex`
#   page_watch      - a careers page with no structure; reports new links that look like vacancies
#   manual          - can't be read automatically (login, blocked, or needs a browser); listed in the
#                     digest as "check by hand"
#
# location: "tt"     - every job on this source is in Trinidad & Tobago, no filtering needed
#           "filter" - the source is regional/global; keep only TT (and remote) jobs
#
# enabled: false turns a source off without deleting it.

sources:
  # ---------------- From your bookmarks ----------------
  - name: CaribbeanJobs - IT (Trinidad)
    type: links
    company: (various)
    location: tt
    urls:
      - https://www.caribbeanjobs.com/ShowResults.aspx?Category=3&SortBy=Relevance&rbloc=124&lr=4&PerPage=100
      - https://www.caribbeanjobs.com/Trinidad-and-Tobago/IT-Jobs?PerPage=100
      - https://www.caribbeanjobs.com/Trinidad-and-Tobago/Port-of-Spain/IT-Jobs?PerPage=100
    link_regex: '^https?://(www\.)?caribbeanjobs\.com/([^/?#]+-Job-\d+\.aspx|JobDesc\.aspx\?Id=\d+)$'
    title_from: caribbeanjobs

  - name: First Citizens - ICT
    type: successfactors
    company: First Citizens Bank
    base_url: https://careers.firstcitizenstt.com
    location: tt

  - name: ANSA McAL
    type: successfactors
    company: ANSA McAL Group
    base_url: https://careers.ansamcal.com
    location: filter

  - name: Digicel
    type: successfactors
    company: Digicel
    base_url: https://careers.digicelgroup.com
    location: filter
    location_search: Trinidad

  - name: Shell
    type: manual            # switch back to "workday" to retry; the settings below are ready
    company: Shell
    url: https://shell.wd3.myworkdayjobs.com/en-GB/ShellCareers?q=Trinidad
    why: Shell's Workday rate-limits GitHub's servers (429) - search "Trinidad"
    base_url: https://shell.wd3.myworkdayjobs.com
    tenant: shell
    site: ShellCareers
    location: filter
    search_terms: [Trinidad, Port of Spain]

  - name: TransUnion
    type: manual            # switch back to "workday" to retry
    url: https://transunion.wd5.myworkdayjobs.com/en-US/TransUnion?q=Trinidad
    why: TransUnion's Workday rate-limits GitHub's servers (429) - search "Trinidad"
    workday_settings: ready
    company: TransUnion
    base_url: https://transunion.wd5.myworkdayjobs.com
    tenant: transunion
    site: TransUnion
    location: filter
    search_terms: [Trinidad, Remote]

  - name: Guardian Group
    type: oracle_hcm
    company: Guardian Group
    base_url: https://fa-eqnr-saasfaprod1.fa.ocs.oraclecloud.com
    site_number: CX_1020
    location: filter

  - name: EmployTT (Government)
    type: links
    company: (Government of T&T)
    location: tt
    urls:
      - https://employtt.gov.tt/jobs/list
    link_regex: '^https?://(www\.)?employtt\.gov\.tt/jobs/view/\d+'

  - name: JobsTT
    type: links
    company: (various)
    location: tt
    urls:
      - https://jobstt.com/job
    link_regex: '^https?://(www\.)?jobstt\.com/job/[a-z0-9-]+/?$'

  - name: NGC
    type: page_watch
    company: NGC
    location: tt
    urls: [https://ngc.co.tt/career-opportunities/, https://ngc.co.tt/careers/]

  - name: Republic Bank (RFHL)
    type: manual
    company: Republic Bank
    url: https://rfhl.com/trinidad-and-tobago/en/bank/about/career-opportunities
    why: site blocks automated access (403) - Republic also advertises on CaribbeanJobs, which is checked

  - name: JMMB
    type: page_watch
    company: JMMB
    location: tt
    urls: [https://tt.jmmb.com/about-careers]

  - name: RBC
    type: manual
    company: RBC Royal Bank
    url: https://jobs.rbc.com/ca/en/search-results?keywords=Trinidad
    why: JavaScript-only search page

  - name: Sagicor
    type: manual
    company: Sagicor
    url: https://career4.successfactors.com/career?company=sagicorfinP2&career_ns=job_listing_summary&navBarLevel=JOB_SEARCH
    why: old SuccessFactors portal that blocks automated access

  - name: LinkedIn
    type: manual
    company: (various)
    url: https://www.linkedin.com/jobs/search/?keywords=software%20OR%20data%20OR%20automation&location=Trinidad%20and%20Tobago
